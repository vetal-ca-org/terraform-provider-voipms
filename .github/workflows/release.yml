# Provider release workflow.
# A v* tag runs GoReleaser (GitHub Release). Terraform Registry and OpenTofu
# Registry both ingest that release; the registry jobs wait in parallel until
# each listing shows the new version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  registry:
    name: ${{ matrix.name }} Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Terraform
            versions_url: https://registry.terraform.io/v1/providers/vetal-ca-org/voipms/versions
            timeout_minutes: 20
          - name: OpenTofu
            versions_url: https://registry.opentofu.org/v1/providers/vetal-ca-org/voipms/versions
            timeout_minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Wait until ${{ matrix.name }} Registry lists this version
        run: |
          scripts/wait-for-registry.sh \
            "${{ matrix.name }}" \
            "${{ matrix.versions_url }}" \
            "${GITHUB_REF_NAME}" \
            "$(( ${{ matrix.timeout_minutes }} * 60 - 60 ))"
